
services:
  codelens:
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: codelens-rag
    
    ports:
      - "8501:8501"
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./test_code:/app/test_code:ro
      # Датасет для индексации. Чтобы индексировать свой код, поменяйте путь слева
      - ./indexer/gymhero/gymhero:/app/dataset:ro
      - hf_cache:/root/.cache/huggingface
    
    environment:
      - PYTHONUNBUFFERED=1
      - INDEX_DIR=/app/dataset
      # Тестовые вопросы для страницы метрик (должны относиться к индексируемому коду)
      - CODELENS_EVAL_FILE=eval_questions_gymhero.json
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    
    restart: unless-stopped

volumes:
  hf_cache:
    driver: local